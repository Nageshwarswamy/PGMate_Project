{% extends "base.html" %}{% block page_title %}Record rent{% endblock %}{% block content %}<div class="form-wrap"><div class="eyebrow">FINANCE</div><h1>Record rent entry</h1><p class="muted">Record a paid receipt or mark rent as pending.</p><form method="post" class="panel form-grid">
<label>Resident<select name="resident_id" required><option value="">Choose resident</option>{% for r in residents %}<option value="{{ r.resident_id }}">{{ r.name }} · Room {{ r.room_number }}</option>{% endfor %}</select></label><label>Rent month<input name="rent_month" placeholder="November 2026" required></label><label>Amount (₹)<input type="number" name="amount" min="0.01" step="0.01" required></label><label>Payment date<input type="date" name="payment_date" value="{{ today }}" required></label><label>Status<select name="status"><option>Paid</option><option>Pending</option></select></label><label>Payment method<select name="payment_method"><option>Cash</option><option>UPI</option><option>Bank transfer</option><option>Card</option></select></label><label>UPI/bank reference (optional)<input name="reference_number"></label><div class="form-actions"><a class="button secondary" href="{{ url_for('dashboard') }}">Cancel</a><button class="button">Save rent entry</button></div></form></div>{% endblock %}
